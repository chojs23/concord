[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.31.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell", "npm", "homebrew"]
# Publish the npm installer as a scoped package to avoid global name collisions.
npm-scope = "@chojs23"
# Target platforms to build apps for (Rust target-triple syntax)
targets = [
  "aarch64-apple-darwin",
  "aarch64-unknown-linux-gnu",
  "x86_64-apple-darwin",
  "x86_64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false
# Features to pass to cargo build
features = ["voice-playback", "stream-broadcast"]
# A GitHub repo to push Homebrew formulas to
tap = "chojs23/homebrew-tap"
# Publish jobs to run in CI
publish-jobs = ["homebrew", "npm"]
# Skip checking whether the specified configuration files are up to date
allow-dirty = ["ci"]

[dist.github-custom-runners]
global = "ubuntu-24.04"
aarch64-unknown-linux-gnu = "ubuntu-24.04-arm"
x86_64-unknown-linux-gnu = "ubuntu-24.04"

[dist.dependencies.homebrew]
cmake = { stage = ["build"] }
nasm = { stage = ["build"], targets = ["x86_64-apple-darwin"] }
pkg-config = { stage = ["build"] }
alsa-lib = { stage = [
  "run",
], targets = [
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-gnu",
] }
pipewire = { stage = [
  "run",
], targets = [
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-gnu",
] }
libva = { stage = [
  "run",
], targets = [
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-gnu",
] }
mesa = { stage = [
  "run",
], targets = [
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-gnu",
] }

[dist.dependencies.apt]
cmake = { stage = ["build"] }
libasound2-dev = { stage = ["build"] }
libclang-dev = { stage = ["build"] }
"libpipewire-0.3-dev" = { stage = ["build"] }
libva-dev = { stage = ["build"] }
nasm = { stage = ["build"], targets = ["x86_64-unknown-linux-gnu"] }
pkg-config = { stage = ["build"] }

[dist.dependencies.chocolatey]
cmake = { stage = ["build"], targets = ["x86_64-pc-windows-msvc"] }
nasm = { stage = ["build"], targets = ["x86_64-pc-windows-msvc"] }
