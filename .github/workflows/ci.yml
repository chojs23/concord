name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: fmt + clippy + test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: install native media dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            libasound2-dev \
            libclang-dev \
            libpipewire-0.3-dev \
            libva-dev \
            nasm \
            pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-check

      - name: rustfmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: clippy (no voice or screen broadcasting)
        run: cargo clippy --all-targets --no-default-features -- -D warnings

      - name: test
        run: cargo test --all-features

      # Validates dist-workspace.toml + Cargo.toml so a PR that breaks the
      # release config gets caught here, not at next tag push.
      - name: install cargo-dist
        shell: bash
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.31.0/cargo-dist-installer.sh | sh

      - name: dist config check
        run: cargo dist plan

  platform-encoder-check:
    name: native encoder (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-14
          - name: Windows
            os: windows-2022
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: install macOS media dependencies
        if: runner.os == 'macOS'
        run: brew install cmake nasm pkg-config

      - name: install Windows media dependencies
        if: runner.os == 'Windows'
        run: choco install cmake nasm --no-progress -y

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: native-encoder-${{ runner.os }}

      - name: clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: encoder tests
        run: cargo test --locked --all-features discord::voice::capture::encoder::tests

  release-cache-plan:
    name: plan release cache warm
    needs: [check, platform-encoder-check]
    if: ${{ needs.check.result == 'success' && needs.platform-encoder-check.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    continue-on-error: true
    runs-on: ubuntu-24.04
    outputs:
      val: ${{ steps.plan.outputs.manifest }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive

      - name: install cargo-dist
        shell: bash
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.31.0/cargo-dist-installer.sh | sh

      - id: plan
        name: plan release-like build
        run: |
          dist plan --output-format=json > plan-dist-manifest.json
          echo "dist plan ran successfully"
          cat plan-dist-manifest.json
          echo "manifest=$(jq -c "." plan-dist-manifest.json)" >> "$GITHUB_OUTPUT"

      - name: upload dist manifest
        uses: actions/upload-artifact@v6
        with:
          name: artifacts-plan-dist-manifest
          path: plan-dist-manifest.json

  release-cache-warm:
    name: warm release cache (${{ join(matrix.targets, ', ') }})
    needs: [release-cache-plan]
    if: ${{ always() && needs.release-cache-plan.result == 'success' && needs.release-cache-plan.outputs.val != '' && fromJson(needs.release-cache-plan.outputs.val).ci.github.artifacts_matrix.include != null }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.release-cache-plan.outputs.val).ci.github.artifacts_matrix }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container && matrix.container.image || null }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: enable windows longpaths
        run: |
          git config --global core.longpaths true

      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Rust non-interactively if not already installed
        if: ${{ matrix.container }}
        run: |
          if ! command -v cargo > /dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          fi

      - name: Install dist
        run: ${{ matrix.install_dist.run }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ join(matrix.targets, '-') }}

      - name: Fetch local artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true

      - name: Install dependencies
        run: |
          ${{ matrix.packages_install }}

      - name: Build artifacts to warm cache
        run: |
          dist build --print=linkage --output-format=json ${{ matrix.dist_args }} > dist-manifest.json
          echo "release-like build cache warmed successfully"
