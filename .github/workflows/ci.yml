name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: fmt + clippy + test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: install native media dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            libasound2-dev \
            libclang-dev \
            libpipewire-0.3-dev \
            libva-dev \
            nasm \
            pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-check

      - name: rustfmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: clippy (no voice or screen broadcasting)
        run: cargo clippy --all-targets --no-default-features -- -D warnings

      - name: test
        run: cargo test --all-features

      # Validates dist-workspace.toml + Cargo.toml so a PR that breaks the
      # release config gets caught here, not at next tag push.
      - name: install cargo-dist
        shell: bash
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.31.0/cargo-dist-installer.sh | sh

      - name: dist config check
        run: cargo dist plan

  musl-check:
    name: musl all-features
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Run inside a native musl environment because cross-checking from glibc
      # does not provide the PipeWire, ALSA, and VA-API libraries for this target.
      - name: check all features on musl
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            --volume /target \
            --env CARGO_TARGET_DIR=/target \
            --workdir /workspace \
            rust:1.90-alpine3.22 \
            sh -c '
              set -eu
              apk add --no-cache \
                alsa-lib-dev \
                build-base \
                clang20-dev \
                cmake \
                libva-dev \
                libx11-dev \
                libxi-dev \
                libxtst-dev \
                linux-headers \
                nasm \
                pipewire-dev \
                pkgconf \
                pulseaudio-dev \
                wayland-dev \
                zstd-dev

              # Bindgen loads libclang at build time, so the build scripts must
              # use the Alpine dynamic musl runtime instead of static CRT linking.
              RUSTFLAGS="-C target-feature=-crt-static" \
                cargo check --locked --all-features
            '

  platform-encoder-check:
    name: native encoder (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-14
          - name: Windows
            os: windows-2022
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: install macOS media dependencies
        if: runner.os == 'macOS'
        run: brew install cmake nasm pkg-config

      - name: install Windows media dependencies
        if: runner.os == 'Windows'
        run: choco install cmake nasm --no-progress -y

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: native-encoder-${{ runner.os }}

      - name: clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: encoder tests
        run: cargo test --locked --all-features discord::voice::capture::encoder::tests
